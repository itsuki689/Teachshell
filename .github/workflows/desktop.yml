name: Cross-platform desktop
on:
  push:
    branches: ["**"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TEACHSHELF_SCREENSHOT_DIR: ${{ github.workspace }}/desktop/test-results/teachshelf-e2e
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - name: Build installers (unsigned)
        run: npm run package -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows and macOS archives
        if: runner.os != 'Linux'
        run: npm run verify:release
      - name: Desktop integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Desktop integration (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:packaged
      - name: Packaged application (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: teachshelf-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teachshelf-tests-${{ matrix.os }}
          path: ${{ github.workspace }}/desktop/test-results/teachshelf-e2e/
          if-no-files-found: warn
